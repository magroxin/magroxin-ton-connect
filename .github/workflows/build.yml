name: MAGROXIN TON Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout MAGROXIN
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install workspace dependencies
        run: npm install

      - name: Build frontend
        run: npm run build -w client

      - name: Check backend TypeScript
        run: npm run check -w server

      - name: Build backend
        run: npm run build -w server

      - name: Verify Jetton files
        run: |
          test -f contracts/jetton-minter.fc
          test -f contracts/jetton-wallet.fc
          test -f contracts/jetton-minter.tlb
          test -f contracts/jetton-wallet.tlb

      - name: Install compiler prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build pkg-config libssl-dev zlib1g-dev libreadline-dev perl

      - name: Download TON source with submodules
        run: |
          git clone --depth 1 --recurse-submodules https://github.com/ton-blockchain/ton.git /tmp/ton
          git -C /tmp/ton submodule update --init --recursive

      - name: Build TON compiler
        run: |
          cmake -S /tmp/ton -B /tmp/ton/build -GNinja \
            -DCMAKE_BUILD_TYPE=Release \
            -DTON_USE_JEMALLOC=OFF
          cmake --build /tmp/ton/build --target func fift -j2
          find /tmp/ton/build -type f \( -name func -o -name fift \) -executable

      - name: Compile Jetton contracts
        shell: bash
        run: |
          FUNC="$(find /tmp/ton/build -type f -name func -executable | head -n 1)"
          FIFT="$(find /tmp/ton/build -type f -name fift -executable | head -n 1)"
          test -n "$FUNC"
          test -n "$FIFT"
          mkdir -p build
          "$FUNC" -V
          "$FUNC" -APS -o build/jetton-minter.fif contracts/jetton-minter.fc
          "$FUNC" -APS -o build/jetton-wallet.fif contracts/jetton-wallet.fc
