name: MAGROXIN TON Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install workspace dependencies
        run: npm install

      - name: Build frontend
        run: npm run build -w client

      - name: Check backend TypeScript
        run: npm run check -w server

      - name: Run backend tests
        run: npm test -w server

      - name: Build backend
        run: npm run build -w server

      - name: Verify contract sources
        run: |
          test -s contracts/jetton-minter.fc
          test -s contracts/jetton-wallet.fc
          test -d contracts/imports

      - name: Install FunC compiler
        run: npm install --no-save --package-lock=false @ton-community/func-js@0.11.0

      - name: Compile Jetton contracts
        shell: bash
        run: |
          mkdir -p build

          node --input-type=module <<'NODE'
          import { compileFunc } from "@ton-community/func-js";
          import { readFileSync, writeFileSync } from "node:fs";
          import path from "node:path";

          const root = process.cwd();

          function resolveSource(requested) {
            const candidates = [
              path.resolve(root, requested),
              path.resolve(root, "contracts", requested),
              path.resolve(root, "contracts", "imports", path.basename(requested))
            ];

            for (const candidate of candidates) {
              try {
                return readFileSync(candidate, "utf8");
              } catch {}
            }

            throw new Error(`Missing FunC source: ${requested}`);
          }

          async function compile(target, outputName) {
            console.log(`Compiling ${target}`);

            const result = await compileFunc({
              targets: [target],
              sources: resolveSource
            });

            if (result.status !== "ok") {
              throw new Error(`Compilation failed for ${target}:\n${result.message}`);
            }

            writeFileSync(
              path.join(root, "build", `${outputName}.boc`),
              Buffer.from(result.codeBoc, "base64")
            );

            writeFileSync(
              path.join(root, "build", `${outputName}.fif`),
              result.fiftCode,
              "utf8"
            );

            console.log(`Created ${outputName}.boc and ${outputName}.fif`);
          }

          await compile("contracts/jetton-minter.fc", "jetton-minter");
          await compile("contracts/jetton-wallet.fc", "jetton-wallet");
          NODE

          test -s build/jetton-minter.boc
          test -s build/jetton-wallet.boc
          test -s build/jetton-minter.fif
          test -s build/jetton-wallet.fif

      - name: Verify committed contract BOCs match compiled sources
        run: |
          test -s contracts/build/jetton-minter.boc
          test -s contracts/build/jetton-wallet.boc
          cmp --silent build/jetton-minter.boc contracts/build/jetton-minter.boc || {
            echo "::error::Committed minter BOC does not match the compiled source."
            exit 1
          }
          cmp --silent build/jetton-wallet.boc contracts/build/jetton-wallet.boc || {
            echo "::error::Committed wallet BOC does not match the compiled source."
            exit 1
          }

      - name: Update contract BOCs
        run: |
          mkdir -p contracts/build
          cp build/jetton-minter.boc contracts/build/jetton-minter.boc
          cp build/jetton-wallet.boc contracts/build/jetton-wallet.boc

      - name: Commit updated BOCs
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          if [[ -n "$(git status --porcelain contracts/build/jetton-minter.boc contracts/build/jetton-wallet.boc)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add contracts/build/jetton-minter.boc contracts/build/jetton-wallet.boc
            git commit -m "Build updated Jetton contract BOCs"
            git push
          else
            echo "Contract BOCs are already up to date."
          fi

      - name: Upload compiled contract artifacts
        uses: actions/upload-artifact@v4
        with:
          name: magroxin-jetton-contracts
          path: |
            build/jetton-minter.boc
            build/jetton-wallet.boc
            build/jetton-minter.fif
            build/jetton-wallet.fif
          if-no-files-found: error
          retention-days: 14
