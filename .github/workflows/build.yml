
name: MAGROXIN TON Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install workspace dependencies
        run: npm install

      - name: Build frontend
        run: npm run build -w client

      - name: Check backend TypeScript
        run: npm run check -w server

      - name: Build backend
        run: npm run build -w server

      - name: Verify Jetton contract files
        run: |
          test -f contracts/jetton-minter.fc
          test -f contracts/jetton-wallet.fc
          test -f contracts/jetton-minter.tlb
          test -f contracts/jetton-wallet.tlb

      - name: Install TON compiler prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build pkg-config libssl-dev zlib1g-dev libreadline-dev

      - name: Build TON compiler
        run: |
          git clone --depth 1 https://github.com/ton-blockchain/ton.git /tmp/ton
          cmake -S /tmp/ton -B /tmp/ton/build -GNinja \
            -DCMAKE_BUILD_TYPE=Release \
            -DTON_USE_JEMALLOC=OFF \
            -DOPENSSL_ROOT_DIR=/usr
          cmake --build /tmp/ton/build --target func fift -j2

      - name: Compile Jetton contracts
        run: |
          FUNC="$(find /tmp/ton/build -type f -name func -executable | head -n 1)"
          test -n "$FUNC"
          mkdir -p build
          "$FUNC" -V
          "$FUNC" -APS -o build/jetton-minter.fif contracts/jetton-minter.fc
          "$FUNC" -APS -o build/jetton-wallet.fif contracts/jetton-wallet.fc
          test -s build/jetton-minter.fif
          test -s build/jetton-wallet.fif

      - name: Upload compiled contract artifacts
        uses: actions/upload-artifact@v4
        with:
          name: magroxin-jetton-contracts
          path: |
            build/jetton-minter.fif
            build/jetton-wallet.fif
          if-no-files-found: error
          retention-days: 14
