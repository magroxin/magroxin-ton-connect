
name: MAGROXIN TON Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install workspace dependencies
        run: npm install

      - name: Build frontend
        run: npm run build -w client

      - name: Check backend TypeScript
        run: npm run check -w server

      - name: Build backend
        run: npm run build -w server

      - name: Verify Jetton contract source files
        run: |
          test -f contracts/jetton-minter.fc
          test -f contracts/jetton-wallet.fc
          test -f contracts/jetton-minter.tlb
          test -f contracts/jetton-wallet.tlb

      - name: Setup TON compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build pkg-config libssl-dev zlib1g-dev
          git clone --depth 1 https://github.com/ton-blockchain/ton.git /tmp/ton
          cmake -S /tmp/ton -B /tmp/ton/build -GNinja -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/ton/build --target func fift -j2
          echo "/tmp/ton/build" >> "$GITHUB_PATH"

      - name: Compile Jetton contracts
        run: |
          mkdir -p build
          func -V
          func -APS -o build/jetton-minter.fif contracts/jetton-minter.fc
          func -APS -o build/jetton-wallet.fif contracts/jetton-wallet.fc
