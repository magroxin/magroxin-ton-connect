
name: MAGROXIN TON Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build frontend
        run: npm run build -w client

      - name: Check backend TypeScript
        run: npm run check -w server

      - name: Build backend
        run: npm run build -w server

      - name: Verify contract source files
        run: |
          test -s contracts/jetton-minter.fc
          test -s contracts/jetton-wallet.fc
          test -s contracts/imports/stdlib.fc

      - name: Install FunC WASM compiler
        run: npm install --no-save @ton-community/func-js@0.11.0

      - name: Compile Jetton contracts
        run: |
          mkdir -p build
          npx func-js --help
          npx func-js contracts/jetton-minter.fc --boc build/jetton-minter.boc
          npx func-js contracts/jetton-wallet.fc --boc build/jetton-wallet.boc
          test -s build/jetton-minter.boc
          test -s build/jetton-wallet.boc

      - name: Upload compiled contract artifacts
        uses: actions/upload-artifact@v4
        with:
          name: magroxin-jetton-contracts
          path: |
            build/jetton-minter.boc
            build/jetton-wallet.boc
          if-no-files-found: error
          retention-days: 14
